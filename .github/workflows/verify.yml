# PolisLab verification — no deploy, no publish.
# Distinguishes generated-data drift detection from regeneration.
name: Verify

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Research integrity and application gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history for release pin)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match locked jsdom/undici engines (^22.22.2 / >=22.19) and local RC verification.
          node-version: '22.23.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies (locked)
        run: npm ci

      - name: Independent Python research verification
        run: npm run verify:research

      - name: Check v0.3 source disclosure before regeneration
        run: python3 scripts/check-v03-disclosure.py

      - name: Validate generated data before regeneration
        run: npm run validate

      - name: Pinned release validation
        run: npm run validate:release

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright Chromium (dedicated test server)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Check v0.3 source and built disclosure
        run: python3 scripts/check-v03-disclosure.py --built

      - name: Artifact safety — reject unpublished research and references
        run: npm run check:artifacts
